[package]
name = "kplanner"
version = "0.1.0"
description = "Korean Study Planner & Pomodoro App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "kplanner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
tauri-plugin-notification = "2.0.0"
tauri-plugin-haptics = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "sync"] }
libsql = { version = "0.6", default-features = false, features = ["replication", "tls"] }

# Aggressive binary size optimization for release / mobile builds
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
