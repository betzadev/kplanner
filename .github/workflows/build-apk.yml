name: Build Android APK (Tauri v2 + Turso)

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: "27.2.12479018"
      RUST_TARGET: "aarch64-linux-android"
      TAURI_TARGET: "aarch64"

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Pre-build diagnostic snapshot to Step Summary
      # ============================================================
      - name: Pre-build diagnostic snapshot
        if: always()
        run: |
          touch tauri-init.log tauri-build.log
          {
            echo "## Pre-build diagnostic snapshot"
            echo ""
            echo "- **Run ID:** ${{ github.run_id }}"
            echo "- **Ref:** ${{ github.ref_name }}"
            echo "- **SHA:** ${{ github.sha }}"
            echo "- **Event:** ${{ github.event_name }}"
            echo "- **Runner:** $(uname -a)"
            echo ""
            echo "### Repo root contents"
            echo '```'
            ls -la
            echo '```'
            echo ""
            echo "### package.json"
            echo '```json'
            cat package.json 2>/dev/null || echo "(not found)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # 3. Setup Java JDK 17
      # ============================================================
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # ============================================================
      # 4. Setup Android NDK 27 + required SDK components
      # ============================================================
      - name: Setup Android NDK and SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "platforms;android-35" \
            "build-tools;34.0.0" "cmake;3.22.1" > /dev/null 2>&1 || true

          NDK_PATH="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          if [ ! -d "$NDK_PATH" ]; then
            echo "Installing NDK ${NDK_VERSION}..."
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" || \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" || \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.3.11579264" || true
            NDK_PATH=$(ls -d "$ANDROID_SDK_ROOT/ndk/27."* 2>/dev/null | sort -V | tail -n 1)
            [ -z "$NDK_PATH" ] && NDK_PATH=$(ls -d "$ANDROID_SDK_ROOT/ndk"/* 2>/dev/null | sort -V | tail -n 1)
          fi

          if [ -z "${NDK_PATH:-}" ] || [ ! -d "$NDK_PATH" ]; then
            echo "::error::NDK installation failed"
            exit 1
          fi

          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "Configured NDK: $NDK_PATH"

      # ============================================================
      # 5. Setup pnpm
      # ============================================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # ============================================================
      # 6. Setup Node.js (NO pnpm cache to avoid exit code 2)
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ============================================================
      # 7. Install Rust toolchain with Android target
      # ============================================================
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      # ============================================================
      # 8. Install JavaScript dependencies (no --frozen-lockfile
      # to avoid exit 100 from lockfile drift)
      # ============================================================
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # ============================================================
      # 9. Build web frontend
      # ============================================================
      - name: Build web frontend
        run: pnpm build

      # ============================================================
      # 10. Ensure Android debug keystore
      # ============================================================
      - name: Ensure Android Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # ============================================================
      # 11. Tauri Android Init
      # ============================================================
      - name: Tauri Android Init
        run: |
          set +e
          if [ ! -d "src-tauri/gen/android/app" ]; then
            echo "=== Running: pnpm tauri android init --ci ===" | tee tauri-init.log
            pnpm tauri android init --ci 2>&1 | tee -a tauri-init.log
            INIT_EXIT=${PIPESTATUS[0]}
            if [ "$INIT_EXIT" -ne 0 ]; then
              {
                echo "## ❌ Tauri Android Init failed (exit $INIT_EXIT)"
                echo ""
                echo "### Full init log"
                echo '```'
                cat tauri-init.log
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit "$INIT_EXIT"
            fi
          else
            echo "Android project already initialized."
          fi

      # ============================================================
      # 12. Write local.properties (AFTER init, so init can't
      # overwrite it)
      # ============================================================
      - name: Write local.properties
        run: |
          cat > src-tauri/gen/android/local.properties <<EOF
sdk.dir=$ANDROID_HOME
ndk.dir=$NDK_HOME
EOF
          cat src-tauri/gen/android/local.properties

      # ============================================================
      # 13. Inject debug signing into release buildType
      # ============================================================
      - name: Inject signing config
        run: |
          [ -f "src-tauri/gen/android/gradlew" ] && chmod +x src-tauri/gen/android/gradlew || true
          python3 << 'PYEOF'
          import pathlib
          p = pathlib.Path("src-tauri/gen/android/app/build.gradle.kts")
          if not p.exists():
              print("WARNING: build.gradle.kts not found")
              raise SystemExit(0)
          c = p.read_text()
          if "signingConfig = signingConfigs.getByName(\"debug\")" not in c:
              marker = "getByName(\"release\") {"
              if marker in c:
                  c = c.replace(marker, marker + "\n            signingConfig = signingConfigs.getByName(\"debug\")", 1)
                  p.write_text(c)
                  print("Injected.")
              else:
                  print("WARNING: release buildType block not found.")
          else:
              print("Already injected.")
          PYEOF

      # ============================================================
      # 14. THE ACTUAL BUILD STEP.
      # Targets 'aarch64' as expected by Tauri CLI (not the full
      # Rust triple 'aarch64-linux-android').
      # ============================================================
      - name: Tauri Android Build APK
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          set +e
          echo "=== BUILD_TYPE: $BUILD_TYPE ===" | tee tauri-build.log
          echo "=== TAURI_TARGET: $TAURI_TARGET ===" | tee -a tauri-build.log
          echo "=== NDK_HOME: $NDK_HOME ===" | tee -a tauri-build.log
          echo "=== Command that will run ===" | tee -a tauri-build.log
          if [ "$BUILD_TYPE" = "release" ]; then
            echo "pnpm tauri android build --apk --target $TAURI_TARGET --verbose" | tee -a tauri-build.log
          else
            echo "pnpm tauri android build --debug --apk --target $TAURI_TARGET --verbose" | tee -a tauri-build.log
          fi
          echo "" | tee -a tauri-build.log
          echo "=== Output ===" | tee -a tauri-build.log
          echo "" | tee -a tauri-build.log

          if [ "$BUILD_TYPE" = "release" ]; then
            pnpm tauri android build --apk --target "$TAURI_TARGET" --verbose 2>&1 | tee -a tauri-build.log
          else
            pnpm tauri android build --debug --apk --target "$TAURI_TARGET" --verbose 2>&1 | tee -a tauri-build.log
          fi
          BUILD_EXIT=${PIPESTATUS[0]}

          echo "" | tee -a tauri-build.log
          echo "=== Build exited with code: $BUILD_EXIT ===" | tee -a tauri-build.log

          if [ "$BUILD_EXIT" -ne 0 ]; then
            {
              echo "## ❌ Tauri Android Build failed (exit code $BUILD_EXIT)"
              echo ""
              echo "**Build type:** $BUILD_TYPE"
              echo "**NDK:** $NDK_HOME"
              echo "**Tauri target:** $TAURI_TARGET"
              echo ""
              echo "### Last 400 lines of build output"
              echo '```'
              tail -n 400 tauri-build.log 2>/dev/null || echo "(no log file)"
              echo '```'
              echo ""
              echo "### Full log available in artifact \`tauri-build-logs\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$BUILD_EXIT"
          fi

          echo "### ✅ Build succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### APK outputs" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \; | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # 15. Upload APK artifact (only on success)
      # ============================================================
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kplanner-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # 16. Upload build log artifact (always, for diagnostics)
      # ============================================================
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-logs
          path: |
            tauri-init.log
            tauri-build.log
            src-tauri/gen/android/app/build/reports/
          if-no-files-found: warn
          retention-days: 14
