name: Build Android APK (Tauri v2 + Turso)

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: "27.2.12479018"
      RUST_TARGET: "aarch64-linux-android"

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Diagnostic snapshot BEFORE anything can fail.
      # Writes to GITHUB_STEP_SUMMARY so it's visible in the Actions UI.
      # ============================================================
      - name: Pre-build diagnostic snapshot
        if: always()
        run: |
          {
            echo "## Pre-build diagnostic snapshot"
            echo ""
            echo "- **Run ID:** ${{ github.run_id }}"
            echo "- **Ref:** ${{ github.ref_name }}"
            echo "- **SHA:** ${{ github.sha }}"
            echo "- **Event:** ${{ github.event_name }}"
            echo "- **Runner:** $(uname -a)"
            echo ""
            echo "### Repo root contents"
            echo '```'
            ls -la
            echo '```'
            echo ""
            echo "### Search for pnpm-lock.yaml"
            echo '```'
            find . -maxdepth 4 -name "pnpm-lock.yaml" 2>/dev/null || echo "(none found)"
            echo '```'
            echo ""
            echo "### package.json (if present)"
            echo '```json'
            cat package.json 2>/dev/null || echo "(not found at repo root)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # 3. Setup Java JDK 17 (Zulu distribution)
      # ============================================================
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ============================================================
      # 4. Setup Android NDK 27 + required SDK components.
      # No `set -e` here — every command is individually guarded.
      # ============================================================
      - name: Setup Android NDK and SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          # Accept licenses (best-effort)
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

          # Install required SDK components (best-effort)
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "platforms;android-35" \
            "build-tools;34.0.0" "cmake;3.22.1" > /dev/null 2>&1 || true

          # Install pinned NDK with triple fallback
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          if [ ! -d "$NDK_PATH" ]; then
            echo "Installing NDK ${NDK_VERSION}..."
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" || \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" || \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.3.11579264" || true
            NDK_PATH=$(ls -d "$ANDROID_SDK_ROOT/ndk/27."* 2>/dev/null | sort -V | tail -n 1)
            [ -z "$NDK_PATH" ] && NDK_PATH=$(ls -d "$ANDROID_SDK_ROOT/ndk"/* 2>/dev/null | sort -V | tail -n 1)
          fi

          if [ -z "${NDK_PATH:-}" ] || [ ! -d "$NDK_PATH" ]; then
            echo "::error::NDK installation failed"
            exit 1
          fi

          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "Configured NDK: $NDK_PATH"

      # ============================================================
      # 5. Setup pnpm (using v4 — battle-tested, no v5 surprises)
      # ============================================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # ============================================================
      # 6. Setup Node.js 22 (NO pnpm cache — avoids exit code 2
      # when pnpm-lock.yaml is missing or out of sync).
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ============================================================
      # 7. Install Rust toolchain with Android target
      # ============================================================
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      # ============================================================
      # 8. Install JavaScript dependencies.
      # Uses --no-frozen-lockfile to avoid exit 100 from lockfile
      # drift. Explicit exit code capture and propagation.
      # ============================================================
      - name: Install dependencies
        run: |
          echo "=== pnpm version ==="
          pnpm --version
          echo "=== node version ==="
          node --version
          echo "=== pnpm install --no-frozen-lockfile ==="
          pnpm install --no-frozen-lockfile
          INSTALL_EXIT=$?
          echo "pnpm install exit code: $INSTALL_EXIT"
          exit $INSTALL_EXIT

      # ============================================================
      # 9. Build web frontend
      # ============================================================
      - name: Build web frontend
        run: pnpm build

      # ============================================================
      # 10. Ensure Android debug keystore exists (used by both
      # debug and release-with-debug-signing builds).
      # ============================================================
      - name: Ensure Android Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore ~/.android/debug.keystore -storepass android | head -5

      # ============================================================
      # 11. Initialize Android project, inject signing config,
      # and build the APK. No `set -e` so a non-critical sub-step
      # doesn't abort the build silently.
      # ============================================================
      - name: Initialize Android project and build APK
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          echo "=== TAURI INFO ==="
          pnpm tauri info || true

          echo "=== TAURI ANDROID INIT ==="
          if [ ! -d "src-tauri/gen/android/app" ]; then
            pnpm tauri android init --ci
          else
            echo "Android project already initialized."
          fi

          echo "=== WRITE local.properties ==="
          cat > src-tauri/gen/android/local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          ndk.dir=$NDK_HOME
          EOF
          cat src-tauri/gen/android/local.properties

          echo "=== CHMOD gradlew ==="
          [ -f "src-tauri/gen/android/gradlew" ] && chmod +x src-tauri/gen/android/gradlew || true

          echo "=== INJECT debug signing into release buildType ==="
          GRADLE_APP="src-tauri/gen/android/app/build.gradle.kts"
          if [ -f "$GRADLE_APP" ]; then
            python3 << 'PYEOF'
          import pathlib
          p = pathlib.Path("src-tauri/gen/android/app/build.gradle.kts")
          c = p.read_text()
          if "signingConfig = signingConfigs.getByName(\"debug\")" not in c:
              marker = "getByName(\"release\") {"
              if marker in c:
                  c = c.replace(marker, marker + "\n            signingConfig = signingConfigs.getByName(\"debug\")", 1)
                  p.write_text(c)
                  print("Injected.")
              else:
                  print("WARNING: release buildType block not found.")
          else:
              print("Already injected.")
          PYEOF
          else
            echo "WARNING: $GRADLE_APP not found."
          fi

          echo "=== TAURI ANDROID BUILD ($BUILD_TYPE) ==="
          if [ "$BUILD_TYPE" = "release" ]; then
            pnpm tauri android build --apk --target "$RUST_TARGET" --verbose
          else
            pnpm tauri android build --debug --apk --target "$RUST_TARGET" --verbose
          fi

          echo "=== APK OUTPUTS ==="
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \; || true

      # ============================================================
      # 12. On failure: diagnostic dump to step summary.
      # Wrapped in subshell + || true so this step itself can
      # never fail the job.
      # ============================================================
      - name: Failure diagnostics
        if: failure()
        continue-on-error: true
        run: |
          {
            echo "## ❌ Build failed — diagnostic dump"
            echo ""
            echo "### Environment"
            echo '```'
            env | grep -E "^(ANDROID|NDK|RUST|BUILD_TYPE|TURSO)" | sort
            echo '```'
            echo ""
            echo "### Rust targets installed"
            echo '```'
            rustup target list --installed 2>/dev/null || echo "(rustup not available)"
            echo '```'
            echo ""
            echo "### NDK directory"
            echo '```'
            ls -la "$NDK_HOME" 2>/dev/null || echo "(NDK_HOME not set or directory missing)"
            echo '```'
            echo ""
            echo "### src-tauri/gen/android tree"
            echo '```'
            find src-tauri/gen/android -maxdepth 3 -type f 2>/dev/null | head -50 || echo "(android project not generated)"
            echo '```'
            echo ""
            echo "### local.properties"
            echo '```'
            cat src-tauri/gen/android/local.properties 2>/dev/null || echo "(not found)"
            echo '```'
            echo ""
            echo "### build.gradle.kts (signingConfigs block)"
            echo '```'
            grep -B 2 -A 30 "signingConfigs" src-tauri/gen/android/app/build.gradle.kts 2>/dev/null || echo "(file not found)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      # ============================================================
      # 13. Upload APK artifact (always runs so we get partial
      # outputs even on failure).
      # ============================================================
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kplanner-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk.sha256
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # 14. Upload full build log artifact (so user can download
      # it without needing to dig into Actions logs).
      # ============================================================
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            src-tauri/gen/android/app/build/reports/
          if-no-files-found: warn
          retention-days: 7
