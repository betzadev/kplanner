name: Build Android APK (Tauri v2 + Turso)

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK and SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

          # Add SDK commandline tools and platform tools to PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

          # Accept licenses
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          # Find existing NDK or install one if not present
          if [ -d "$ANDROID_SDK_ROOT/ndk" ] && [ -n "$(ls -A "$ANDROID_SDK_ROOT/ndk" 2>/dev/null)" ]; then
            NDK_PATH=$(ls -d "$ANDROID_SDK_ROOT/ndk"/* | sort -V | tail -n 1)
          else
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125"
            NDK_PATH="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          fi

          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "Detected NDK at: $NDK_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build Web Frontend
        run: pnpm build

      - name: Ensure Android Debug Keystore Exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "Generating debug keystore..."
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Initialize Android Project and Build APK
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NDK_HOME: ${{ env.NDK_HOME }}
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          set -euo pipefail
          (
            echo "=== TAURI INFO ==="
            pnpm tauri info || true

            echo "=== TAURI ANDROID INIT ==="
            if [ ! -d "src-tauri/gen/android" ]; then
              pnpm tauri android init --ci
            fi

            echo "=== GRADLEW CHMOD & SIGNING CONFIG INJECTION ==="
            if [ -f "src-tauri/gen/android/gradlew" ]; then
              chmod +x src-tauri/gen/android/gradlew
            fi

            GRADLE_APP="src-tauri/gen/android/app/build.gradle.kts"
            if [ -f "$GRADLE_APP" ]; then
              python3 -c '
              import pathlib
              p = pathlib.Path("src-tauri/gen/android/app/build.gradle.kts")
              c = p.read_text()
              if "signingConfig = signingConfigs.getByName(\"debug\")" not in c:
                  c = c.replace(
                      "getByName(\"release\") {",
                      "getByName(\"release\") {\n            signingConfig = signingConfigs.getByName(\"debug\")"
                  )
                  p.write_text(c)
                  print("Injected debug signing config into release build type.")
              '
            fi

            echo "=== TAURI ANDROID BUILD ($BUILD_TYPE - aarch64) ==="
            if [ "$BUILD_TYPE" = "release" ]; then
              pnpm tauri android build --apk --target aarch64
            else
              pnpm tauri android build --debug --apk --target aarch64
            fi
          ) 2>&1 | tee build.log

      - name: Push Build Log to ci-logs Branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f build.log
          git commit -m "ci: capture build log" || true
          git push -f origin ci-logs || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kplanner-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/app-*.apk
          if-no-files-found: error
