name: Build Android APK (Tauri v2 + Turso)

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04

    env:
      # Pin NDK version centrally so all steps use the same value
      NDK_VERSION: "27.2.12479018"
      RUST_TARGET: "aarch64-linux-android"

    steps:
      # Step 1: Checkout repository (Node.js 24 runtime, no deprecation warnings)
      # fetch-depth: 0 ensures full history for branch operations in ci-logs push step
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Pre-create build.log so the "Push Build Log" step never fails with
      # git exit code 128 (pathspec didn't match) when an early step aborts.
      - name: Initialize build log
        run: |
          echo "Build started at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > build.log
          echo "Run: ${{ github.run_id }} / Attempt: ${{ github.run_attempt }}" >> build.log
          echo "Ref: ${{ github.ref_name }} / SHA: ${{ github.sha }}" >> build.log
          echo "------------------------------------------------------------" >> build.log

      # Step 2: Install Linux system dependencies required by Android SDK tools
      # (libncurses5 is not shipped on Ubuntu 22.04 and is required by some NDK binaries)
      # continue-on-error: true ensures a transient apt issue never aborts the whole build
      - name: Install system dependencies
        continue-on-error: true
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libncurses5 libncursesw5 libstdc++6 libz3-0 \
            cmake ninja-build pkg-config libssl-dev
          # Provide a libtinfo symlink fallback for some prebuilt NDK toolchains
          if [ ! -f /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
          fi

      # Step 3: Setup Java JDK 17 (Node.js 24 runtime, resolves setup-java v4 deprecation)
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 4: Setup Android NDK and SDK Environment (NDK 27 LTS for AGP & Tauri v2)
      - name: Setup Android NDK and SDK Environment
        run: |
          set -eo pipefail
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          # Accept all Android SDK licenses non-interactively
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

          # Ensure required SDK components are installed (build-tools, platforms, cmake)
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" > /dev/null 2>&1 || true

          # Install pinned NDK version (27.2.12479018 LTS) with fallbacks
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          if [ ! -d "$NDK_PATH" ]; then
            echo "NDK ${NDK_VERSION} not pre-installed. Installing via sdkmanager..."
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" || \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" || \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.3.11579264"
            # Recompute NDK_PATH after install (pick whatever 27.x or latest available)
            NDK_PATH=$(ls -d "$ANDROID_SDK_ROOT/ndk/27."* 2>/dev/null | sort -V | tail -n 1)
            if [ -z "$NDK_PATH" ]; then
              NDK_PATH=$(ls -d "$ANDROID_SDK_ROOT/ndk"/* 2>/dev/null | sort -V | tail -n 1)
            fi
          fi

          if [ -z "${NDK_PATH:-}" ] || [ ! -d "$NDK_PATH" ]; then
            echo "::error::NDK installation failed. No NDK directory found."
            exit 1
          fi

          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "Configured NDK at: $NDK_PATH"
          ls -la "$NDK_PATH" | head -20

      # Step 5: Setup pnpm (v5 of the action, Node.js 24 runtime)
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      # Step 6: Setup Node.js 22 with pnpm cache enabled
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      # Step 7: Install JavaScript dependencies
      # IMPORTANT: pnpm exits 100 on --frozen-lockfile when lockfile is out of sync
      # with package.json. We try frozen first (CI best practice), then fall back
      # to a regular install. The `set +e` + explicit handling avoids propagating
      # exit 100 to the job.
      - name: Install dependencies
        run: |
          set +e
          echo "Attempting frozen lockfile install (CI best practice)..." | tee -a build.log
          pnpm install --frozen-lockfile 2>&1 | tee -a build.log
          FROZEN_EXIT=${PIPESTATUS[0]}
          if [ "$FROZEN_EXIT" -ne 0 ]; then
            echo "::warning::pnpm --frozen-lockfile failed (exit $FROZEN_EXIT). Falling back to regular install."
            echo "Lockfile is out of sync with package.json — please commit an updated pnpm-lock.yaml."
            pnpm install 2>&1 | tee -a build.log
            exit ${PIPESTATUS[0]}
          fi
          exit 0

      # Step 8: Install Rust toolchain with the Android aarch64 target
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      # Step 9: Build Web Frontend (must succeed before Tauri build)
      - name: Build Web Frontend
        run: pnpm build 2>&1 | tee -a build.log

      # Step 10: Ensure Android Debug Keystore exists (standard, used for both debug and release fallback)
      - name: Ensure Android Debug Keystore Exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "Generating standard Android debug keystore..."
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Debug keystore already present at ~/.android/debug.keystore"
          fi
          # Verify the keystore is valid and readable
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | head -20

      # Step 11: Initialize Android project, configure NDK, inject signing config, build APK
      - name: Initialize Android Project and Build APK
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          # NOTE: 'pipefail' is set so failures inside the subshell propagate through 'tee'
          set -eo pipefail
          (
            echo "=== ENVIRONMENT CHECK ==="
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "NDK_HOME=$NDK_HOME"
            echo "NDK version: $(cat "$NDK_HOME/source.properties" 2>/dev/null | grep Pkg.Revision || echo 'unknown')"
            echo "BUILD_TYPE=$BUILD_TYPE"
            echo ""
            echo "=== TAURI INFO ==="
            pnpm tauri info || true

            echo "=== TAURI ANDROID INIT ==="
            if [ ! -d "src-tauri/gen/android/app" ]; then
              pnpm tauri android init --ci
            else
              echo "Android project already initialized, skipping init."
            fi

            echo "=== WRITE LOCAL.PROPERTIES (pointing to NDK 27) ==="
            # local.properties MUST be written AFTER tauri android init,
            # because init may overwrite it with its own default values.
            cat > src-tauri/gen/android/local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          ndk.dir=$NDK_HOME
          EOF
            cat src-tauri/gen/android/local.properties

            echo "=== GRADLEW CHMOD ==="
            if [ -f "src-tauri/gen/android/gradlew" ]; then
              chmod +x src-tauri/gen/android/gradlew
            fi

            echo "=== SIGNING CONFIG INJECTION (release buildType uses debug keystore) ==="
            GRADLE_APP="src-tauri/gen/android/app/build.gradle.kts"
            if [ -f "$GRADLE_APP" ]; then
              python3 << 'PYEOF'
          import pathlib
          p = pathlib.Path("src-tauri/gen/android/app/build.gradle.kts")
          c = p.read_text()
          if "signingConfig = signingConfigs.getByName(\"debug\")" not in c:
              marker = "getByName(\"release\") {"
              if marker in c:
                  c = c.replace(
                      marker,
                      marker + "\n            signingConfig = signingConfigs.getByName(\"debug\")",
                      1
                  )
                  p.write_text(c)
                  print("Injected debug signing config into release build type.")
              else:
                  print("WARNING: 'getByName(\"release\") {' block not found in build.gradle.kts")
          else:
              print("Signing config already present, no changes needed.")
          PYEOF
            else
              echo "WARNING: $GRADLE_APP not found. Init may have failed."
            fi

            echo "=== TAURI ANDROID BUILD ($BUILD_TYPE - $RUST_TARGET) ==="
            if [ "$BUILD_TYPE" = "release" ]; then
              pnpm tauri android build --apk --target "$RUST_TARGET" --verbose
            else
              pnpm tauri android build --debug --apk --target "$RUST_TARGET" --verbose
            fi

            echo "=== APK OUTPUT LISTING ==="
            find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
          ) 2>&1 | tee -a build.log

      # Step 12: On failure, dump diagnostic info before the log is pushed
      - name: Diagnostics on failure
        if: failure()
        run: |
          {
            echo "=== FAILED BUILD DIAGNOSTICS ==="
            echo "--- Rust target check ---"
            rustup target list --installed || true
            echo "--- NDK directory ---"
            ls -la "$NDK_HOME" 2>/dev/null || true
            echo "--- Android project tree ---"
            ls -la src-tauri/gen/android/ 2>/dev/null || true
            ls -la src-tauri/gen/android/app/ 2>/dev/null || true
            echo "--- local.properties ---"
            cat src-tauri/gen/android/local.properties 2>/dev/null || true
            echo "--- build.gradle.kts (signingConfigs block) ---"
            grep -A 30 "signingConfigs" src-tauri/gen/android/app/build.gradle.kts 2>/dev/null || true
            echo "--- Last 100 lines of build.log ---"
            tail -n 100 build.log 2>/dev/null || echo "(build.log not found)"
          } | tee -a build.log

      # Step 13: Push Build Log to ci-logs Branch for diagnostic traceability
      # This step is best-effort: it MUST NOT fail the job even if git operations fail.
      # continue-on-error: true guarantees the job's overall exit code reflects only
      # the actual build, never the log-pushing sidecar.
      - name: Push Build Log to ci-logs Branch
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ensure build.log exists even if an earlier step crashed before creating it
          if [ ! -f build.log ]; then
            echo "build.log was not created by any prior step — creating empty placeholder." > build.log
          fi
          # Append final status marker
          echo "------------------------------------------------------------" >> build.log
          echo "Build finished at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> build.log

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Use the GITHUB_TOKEN authenticated remote so push works without PAT
          REPO="${{ github.repository }}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          # Detach any local mods (e.g. local.properties, build.gradle.kts injections)
          # so checkout -B can switch branches cleanly without exit 128 conflicts.
          git stash --include-untracked -q || true
          git checkout -B ci-logs

          git add -f build.log
          git commit -m "ci: capture build log (run ${{ github.run_id }})" || true
          git push -f origin ci-logs || echo "::warning::Could not push ci-logs branch (permissions or protected branch)."

      # Step 14: Upload APK Artifact (Node.js 24 runtime)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: kplanner-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/app-*.apk
          if-no-files-found: error
          retention-days: 30
