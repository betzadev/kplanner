name: Build Android APK (Tauri v2 + Turso)

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04

    env:
      NDK_VERSION: "27.2.12479018"
      RUST_TARGET: "aarch64-linux-android"

    steps:
      # ============================================================
      # Step 1: Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # Step 2: Pre-create build.log so the "Push Build Log" step
      # never fails with git exit code 128 (pathspec didn't match).
      # ============================================================
      - name: Initialize build log
        run: |
          {
            echo "Build started at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Run: ${{ github.run_id }} / Attempt: ${{ github.run_attempt }}"
            echo "Ref: ${{ github.ref_name }} / SHA: ${{ github.sha }}"
            echo "Event: ${{ github.event_name }}"
            echo "------------------------------------------------------------"
          } > build.log
          cat build.log

      # ============================================================
      # Step 3: Locate pnpm-lock.yaml (used by pnpm setup + cache)
      # We search common locations so subsequent steps can use it.
      # ============================================================
      - name: Locate pnpm-lock.yaml
        id: locate_lockfile
        continue-on-error: true
        run: |
          # Common locations for the lockfile
          for candidate in \
            "pnpm-lock.yaml" \
            "kplanner/pnpm-lock.yaml" \
            "app/pnpm-lock.yaml" \
            "frontend/pnpm-lock.yaml"; do
            if [ -f "$candidate" ]; then
              LOCK_DIR=$(dirname "$candidate")
              echo "Found lockfile at: $candidate"
              echo "lockfile_path=$candidate" >> "$GITHUB_OUTPUT"
              echo "lockfile_dir=$LOCK_DIR" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::warning::pnpm-lock.yaml not found. pnpm cache will be disabled."
          echo "lockfile_path=" >> "$GITHUB_OUTPUT"
          echo "lockfile_dir=" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Step 4: Install Linux system dependencies.
      # continue-on-error: true so a transient apt issue never aborts.
      # ============================================================
      - name: Install system dependencies
        continue-on-error: true
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libncurses5 libncursesw5 libstdc++6 libz3-0 \
            cmake ninja-build pkg-config libssl-dev
          if [ ! -f /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
          fi

      # ============================================================
      # Step 5: Setup Java JDK 17
      # ============================================================
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # ============================================================
      # Step 6: Setup Android NDK 27 and required SDK components
      # ============================================================
      - name: Setup Android NDK and SDK Environment
        run: |
          set -eo pipefail
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" > /dev/null 2>&1 || true

          NDK_PATH="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          if [ ! -d "$NDK_PATH" ]; then
            echo "NDK ${NDK_VERSION} not pre-installed. Installing via sdkmanager..."
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" || \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" || \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.3.11579264"
            NDK_PATH=$(ls -d "$ANDROID_SDK_ROOT/ndk/27."* 2>/dev/null | sort -V | tail -n 1)
            if [ -z "$NDK_PATH" ]; then
              NDK_PATH=$(ls -d "$ANDROID_SDK_ROOT/ndk"/* 2>/dev/null | sort -V | tail -n 1)
            fi
          fi

          if [ -z "${NDK_PATH:-}" ] || [ ! -d "$NDK_PATH" ]; then
            echo "::error::NDK installation failed. No NDK directory found."
            exit 1
          fi

          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "Configured NDK at: $NDK_PATH"
          ls -la "$NDK_PATH" | head -20

      # ============================================================
      # Step 7: Setup pnpm
      # ============================================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      # ============================================================
      # Step 8: Setup Node.js 22 (WITHOUT pnpm cache — the cache
      # feature fails with exit code 2 when pnpm-lock.yaml is not
      # present at the repo root, which is the most likely cause
      # of the exit code 2 we were seeing).
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # ============================================================
      # Step 9: Install JavaScript dependencies.
      # IMPORTANT: --frozen-lockfile exits 100 when lockfile is out
      # of sync with package.json. We skip --frozen-lockfile entirely
      # to avoid that scenario, and rely on `pnpm install --no-frozen-lockfile`
      # semantics. We also disable `set -e` for this step so a pnpm
      # failure doesn't abort before we can capture diagnostics.
      # ============================================================
      - name: Install dependencies
        run: |
          set +e
          echo "=== pnpm install (no frozen lockfile) ===" | tee -a build.log
          pnpm install --no-frozen-lockfile 2>&1 | tee -a build.log
          PNPM_EXIT=${PIPESTATUS[0]}
          echo "pnpm install exited with code: $PNPM_EXIT" | tee -a build.log
          if [ "$PNPM_EXIT" -ne 0 ]; then
            echo "::error::pnpm install failed with exit code $PNPM_EXIT. See build.log in ci-logs branch."
            echo "--- pnpm version ---" | tee -a build.log
            pnpm --version 2>&1 | tee -a build.log
            echo "--- node version ---" | tee -a build.log
            node --version 2>&1 | tee -a build.log
            echo "--- package.json ---" | tee -a build.log
            cat package.json 2>&1 | tee -a build.log
            exit "$PNPM_EXIT"
          fi
          exit 0

      # ============================================================
      # Step 10: Install Rust toolchain with aarch64-linux-android target
      # ============================================================
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      # ============================================================
      # Step 11: Build Web Frontend
      # ============================================================
      - name: Build Web Frontend
        run: |
          set +e
          echo "=== pnpm build ===" | tee -a build.log
          pnpm build 2>&1 | tee -a build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::error::pnpm build failed with exit code $BUILD_EXIT"
            exit "$BUILD_EXIT"
          fi
          exit 0

      # ============================================================
      # Step 12: Ensure Android Debug Keystore exists
      # ============================================================
      - name: Ensure Android Debug Keystore Exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "Generating standard Android debug keystore..."
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Debug keystore already present at ~/.android/debug.keystore"
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | head -20

      # ============================================================
      # Step 13: Initialize Android project, configure NDK, inject
      # signing config, and build the APK.
      # ============================================================
      - name: Initialize Android Project and Build APK
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          set -eo pipefail
          (
            echo "=== ENVIRONMENT CHECK ==="
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "NDK_HOME=$NDK_HOME"
            echo "NDK version: $(cat "$NDK_HOME/source.properties" 2>/dev/null | grep Pkg.Revision || echo 'unknown')"
            echo "BUILD_TYPE=$BUILD_TYPE"
            echo ""
            echo "=== TAURI INFO ==="
            pnpm tauri info || true

            echo "=== TAURI ANDROID INIT ==="
            if [ ! -d "src-tauri/gen/android/app" ]; then
              pnpm tauri android init --ci
            else
              echo "Android project already initialized, skipping init."
            fi

            echo "=== WRITE LOCAL.PROPERTIES ==="
            cat > src-tauri/gen/android/local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          ndk.dir=$NDK_HOME
          EOF
            cat src-tauri/gen/android/local.properties

            echo "=== GRADLEW CHMOD ==="
            if [ -f "src-tauri/gen/android/gradlew" ]; then
              chmod +x src-tauri/gen/android/gradlew
            fi

            echo "=== SIGNING CONFIG INJECTION ==="
            GRADLE_APP="src-tauri/gen/android/app/build.gradle.kts"
            if [ -f "$GRADLE_APP" ]; then
              python3 << 'PYEOF'
          import pathlib
          p = pathlib.Path("src-tauri/gen/android/app/build.gradle.kts")
          c = p.read_text()
          if "signingConfig = signingConfigs.getByName(\"debug\")" not in c:
              marker = "getByName(\"release\") {"
              if marker in c:
                  c = c.replace(
                      marker,
                      marker + "\n            signingConfig = signingConfigs.getByName(\"debug\")",
                      1
                  )
                  p.write_text(c)
                  print("Injected debug signing config into release build type.")
              else:
                  print("WARNING: 'getByName(\"release\") {' block not found in build.gradle.kts")
          else:
              print("Signing config already present, no changes needed.")
          PYEOF
            else
              echo "WARNING: $GRADLE_APP not found. Init may have failed."
            fi

            echo "=== TAURI ANDROID BUILD ($BUILD_TYPE - $RUST_TARGET) ==="
            if [ "$BUILD_TYPE" = "release" ]; then
              pnpm tauri android build --apk --target "$RUST_TARGET" --verbose
            else
              pnpm tauri android build --debug --apk --target "$RUST_TARGET" --verbose
            fi

            echo "=== APK OUTPUT LISTING ==="
            find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
          ) 2>&1 | tee -a build.log

      # ============================================================
      # Step 14: On failure, dump diagnostic info to build.log.
      # Wrapped in a subshell with || true so this step itself
      # never fails the job.
      # ============================================================
      - name: Diagnostics on failure
        if: failure()
        continue-on-error: true
        run: |
          {
            echo "=== FAILED BUILD DIAGNOSTICS ==="
            echo "--- pwd ---"
            pwd
            echo "--- ls root ---"
            ls -la
            echo "--- pnpm-lock.yaml search ---"
            find . -maxdepth 3 -name "pnpm-lock.yaml" 2>/dev/null || true
            echo "--- package.json ---"
            cat package.json 2>/dev/null || echo "(not found)"
            echo "--- Rust target check ---"
            rustup target list --installed || true
            echo "--- NDK directory ---"
            ls -la "$NDK_HOME" 2>/dev/null || true
            echo "--- Android project tree ---"
            ls -la src-tauri/gen/android/ 2>/dev/null || true
            ls -la src-tauri/gen/android/app/ 2>/dev/null || true
            echo "--- local.properties ---"
            cat src-tauri/gen/android/local.properties 2>/dev/null || true
            echo "--- build.gradle.kts signingConfigs block ---"
            grep -A 30 "signingConfigs" src-tauri/gen/android/app/build.gradle.kts 2>/dev/null || true
            echo "--- Last 150 lines of build.log ---"
            tail -n 150 build.log 2>/dev/null || echo "(build.log not found)"
          } | tee -a build.log || true

      # ============================================================
      # Step 15: Push build.log to ci-logs branch (best-effort).
      # continue-on-error: true so a git issue never fails the job.
      # ============================================================
      - name: Push Build Log to ci-logs Branch
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f build.log ]; then
            echo "build.log was not created by any prior step — creating empty placeholder." > build.log
          fi
          echo "------------------------------------------------------------" >> build.log
          echo "Build finished at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> build.log

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          REPO="${{ github.repository }}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          git stash --include-untracked -q || true
          git checkout -B ci-logs

          git add -f build.log
          git commit -m "ci: capture build log (run ${{ github.run_id }})" || true
          git push -f origin ci-logs || echo "::warning::Could not push ci-logs branch."

      # ============================================================
      # Step 16: Upload APK Artifact
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: kplanner-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/app-*.apk
          if-no-files-found: error
          retention-days: 30
